name: Shop sync

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shop-pages
  cancel-in-progress: false

jobs:
  shop:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/depop.test.mjs
      - name: Check API access
        env:
          DEPOP_API_KEY: ${{ secrets.DEPOP_API_KEY }}
        run: |
          if [ -z "$DEPOP_API_KEY" ]; then
            echo 'Add the approved Depop API key as the DEPOP_API_KEY repository secret.'
            exit 1
          fi
      - name: Sync listings
        env:
          DEPOP_API_KEY: ${{ secrets.DEPOP_API_KEY }}
        run: node api/depop.mjs
      - name: Save feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/listings.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update shop listings'
            git push
          fi
      - name: Prepare Pages
        run: |
          mkdir -p site/api
          cp index.html style.css script.js site/
          cp api/listings.json site/api/
          cp -R assets site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4
